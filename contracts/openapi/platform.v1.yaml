openapi: 3.1.0
info:
  title: Platform API
  version: 1.0.0
  summary: Identidad, organizaciones (tenants), membresías, dominios y cuentas de servicio.
  description: >-
    Dueño: Equipo 1 (Content & Platform Foundation). Fuente normativa: `contracts/API-CONTRACTS.md` y
    `AUTH-AND-AUTHORIZATION-CONTRACT.md` del repositorio de arquitectura. El tenant y el actor se derivan
    siempre de la sesión o del token firmado, nunca del cuerpo ni de cabeceras enviadas por el navegador.
  contact: { name: Equipo 1 — Content & Platform Foundation }
  license: { name: UNLICENSED, identifier: UNLICENSED }
servers:
  - url: http://localhost:4000
    description: Desarrollo local
tags:
  - name: auth
    description: BFF de autenticación OIDC (Authorization Code + PKCE)
  - name: me
    description: Identidad, contexto y sesiones del usuario actual
  - name: organizations
    description: Alta y ciclo de vida de organizaciones
  - name: memberships
    description: Membresías, roles e invitaciones
  - name: service-accounts
    description: Credenciales de máquina con scopes mínimos
  - name: domains
    description: Dominios propios y resolución host → sitio
  - name: audit
    description: Auditoría de identidad y autorización

paths:
  /auth/login:
    get:
      operationId: startLogin
      tags: [auth]
      summary: Inicia el login OIDC
      description: Crea `state`, `nonce` y PKCE en el servidor y redirige al proveedor de identidad. `return_to` debe estar en la allowlist exacta.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, format: uri }
      responses:
        '302':
          description: Redirección al proveedor de identidad.
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /auth/callback:
    get:
      operationId: completeLogin
      tags: [auth]
      summary: Completa el login OIDC
      description: Valida `state`, `nonce`, emisor, audiencia y PKCE; vincula `(issuer, sub)`; crea la sesión y redirige al destino original.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 512 } }
      responses:
        '302':
          description: Sesión creada; redirección al destino permitido.
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rota la familia de refresh de la sesión
      description: Reutilizar un refresh ya rotado revoca toda la familia en menos de 60 segundos.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Cookie nueva emitida.
          headers: { Set-Cookie: { schema: { type: string } } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cierra la sesión actual
      description: Idempotente. Siempre termina la sesión local aunque falle el logout federado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sesión revocada y cookie limpiada.
          headers: { Set-Cookie: { schema: { type: string } } }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Revoca todas las familias de sesión del usuario
      description: Exige MFA reciente (`amr` con `mfa` y `auth_time` dentro de 10 minutos).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '204': { description: Todas las sesiones revocadas. }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }

  /platform/v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Identidad proyectada del usuario actual
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Usuario, organización activa, roles y `auth_time`.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Me' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }

  /platform/v1/me/capabilities:
    get:
      operationId: getMyCapabilities
      tags: [me]
      summary: Permisos efectivos del usuario en la organización activa
      description: Los permisos son la unión de los roles menos las restricciones por evento o sede. La denegación es el valor por defecto.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: resource_type,
            in: query,
            required: false,
            schema: { type: string, enum: [site, event, venue] },
          }
        - {
            name: resource_id,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
          }
      responses:
        '200':
          description: Capacidades efectivas.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Capabilities' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }

  /platform/v1/me/organizations:
    get:
      operationId: listMyOrganizations
      tags: [me]
      summary: Membresías activas del usuario
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organizaciones a las que el usuario puede cambiar de contexto.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/OrganizationMembershipSummary' },
                    }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }

  /platform/v1/session-context:
    post:
      operationId: switchOrganizationContext
      tags: [me]
      summary: Cambia la organización activa
      description: Solo permite membresías activas. Reemite la sesión con el tenant nuevo; las cachés privadas no se comparten entre organizaciones.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              additionalProperties: false
              properties:
                organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
      responses:
        '204':
          description: Contexto cambiado.
          headers: { Set-Cookie: { schema: { type: string } } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

  /platform/v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Sesiones y dispositivos del usuario
      description: Nunca expone tokens ni refresh. La IP se muestra seudonimizada.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sesiones enmascaradas.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SessionInfo' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }

  /platform/v1/me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      tags: [me]
      summary: Revoca una sesión propia
      description: Un `security_admin` con `organizations:admin` también puede revocar sesiones de miembros de su organización.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: session_id,
            in: path,
            required: true,
            schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
          }
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '204': { description: Sesión revocada. }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

  /platform/v1/organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Crea una organización y su primer owner
      description: Alta idempotente. Si el aprovisionamiento falla se compensa y la organización no queda a medias.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OrganizationCreate' } }
      responses:
        '201':
          description: Organización creada con su membresía owner activa.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /platform/v1/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Configuración de la organización
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Organización con su ETag.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Edita nombre, zona horaria o idioma
      description: Merge patch con `If-Match`. Exige `organizations:admin`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IfMatch'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            { schema: { $ref: '#/components/schemas/OrganizationPatch' } }
      responses:
        '200':
          description: Organización actualizada.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.v1.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /platform/v1/organizations/{organization_id}/suspensions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: suspendOrganization
      tags: [organizations]
      summary: Suspende la organización
      description: Bloquea las operaciones privadas y revoca sesiones; los sitios públicos se preservan según la política. Solo administrador de plataforma.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } }
      responses:
        '200':
          description: Organización suspendida.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /platform/v1/organizations/{organization_id}/reactivations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: reactivateOrganization
      tags: [organizations]
      summary: Reactiva una organización suspendida
      description: Adición al catálogo (la máquina de estados define `suspended → active`). Solo administrador de plataforma.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } }
      responses:
        '200':
          description: Organización activa.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /platform/v1/organizations/{organization_id}/archives:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: archiveOrganization
      tags: [organizations]
      summary: Archiva la organización (estado terminal)
      description: Adición al catálogo (`active|suspended → archived`). Nunca borra físicamente.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } }
      responses:
        '200':
          description: Organización archivada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /platform/v1/organizations/{organization_id}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: Miembros, roles y estado
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - {
            name: state,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/MembershipState' },
          }
        - {
            name: role,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Role' },
          }
      responses:
        '200':
          description: Página de membresías.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

  /platform/v1/organizations/{organization_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createInvitation
      tags: [memberships]
      summary: Invita a un miembro con roles definidos
      description: >-
        Expira en 7 días como máximo y es de un solo uso. La respuesta nunca incluye el token: se entrega
        por correo mediante el evento de comunicación. No duplica membresías.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InvitationCreate' } }
      responses:
        '201':
          description: Invitación pendiente.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Invitation' } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /public/v1/invitations/{token}/acceptance:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: acceptInvitation
      tags: [memberships]
      summary: Acepta una invitación
      description: Requiere identidad OIDC verificada. El token se guarda hasheado, es de un solo uso y el replay se rechaza. Los logs deben redactar este segmento de la ruta.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Membresía activa.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Membership' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /public/v1/invitations/{token}/declination:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      operationId: declineInvitation
      tags: [memberships]
      summary: Rechaza una invitación
      security: []
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Invitación rechazada. }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /platform/v1/memberships/{membership_id}:
    parameters:
      - {
          name: membership_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    patch:
      operationId: updateMembership
      tags: [memberships]
      summary: Cambia roles, suspende o revoca a un miembro
      description: Nunca deja a la organización sin un `org_owner` activo. Suspender o revocar invalida las sesiones afectadas en menos de 60 segundos.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IfMatch'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/MembershipPatch' } }
      responses:
        '200':
          description: Membresía actualizada.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Membership' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.v1.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /platform/v1/organizations/{organization_id}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createServiceAccount
      tags: [service-accounts]
      summary: Crea una cuenta de servicio
      description: Exige MFA reciente. El secreto se muestra una sola vez; solo se guarda su hash o la referencia a KMS.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ServiceAccountCreate' } }
      responses:
        '201':
          description: Cuenta creada con su credencial de un solo uso.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ServiceAccountWithSecret' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /platform/v1/service-accounts/{service_account_id}/rotations:
    parameters:
      - {
          name: service_account_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    post:
      operationId: rotateServiceAccount
      tags: [service-accounts]
      summary: Rota la credencial con solapamiento controlado
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_at]
              additionalProperties: false
              properties:
                expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
                public_jwk:
                  {
                    type: object,
                    description: Clave pública nueva cuando el método es `private_key_jwt`.,
                  }
      responses:
        '201':
          description: Credencial nueva; la anterior sigue válida durante el solapamiento.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ServiceAccountWithSecret' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /platform/v1/service-accounts/{service_account_id}/revocations:
    parameters:
      - {
          name: service_account_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    post:
      operationId: revokeServiceAccount
      tags: [service-accounts]
      summary: Revoca la cuenta de inmediato
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } }
      responses:
        '200':
          description: Cuenta revocada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ServiceAccount' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

  /platform/v1/sites/{site_id}/domains:
    parameters:
      - {
          name: site_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    post:
      operationId: registerDomain
      tags: [domains]
      summary: Asocia un dominio a un sitio
      description: Genera un desafío DNS o HTTP. El hostname es único globalmente.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DomainCreate' } }
      responses:
        '201':
          description: Dominio pendiente de verificación.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Domain' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /platform/v1/domains/{domain_id}/verifications:
    parameters:
      - {
          name: domain_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    post:
      operationId: verifyDomain
      tags: [domains]
      summary: Verifica el desafío del dominio
      description: Al activarse se emite `platform.domain.activated.v1` y se provisiona TLS.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Estado de verificación.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Domain' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /public/v1/hosts/{hostname}:
    get:
      operationId: resolveHost
      tags: [domains]
      summary: Resuelve un hostname al sitio que lo sirve
      description: Resolver de privilegio mínimo; devuelve solo identificadores opacos. Cacheable con `ETag` y `Surrogate-Key`.
      security: []
      parameters:
        - {
            name: hostname,
            in: path,
            required: true,
            schema: { type: string, format: hostname, maxLength: 253 },
          }
      responses:
        '200':
          description: Sitio asociado al dominio activo.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
            Surrogate-Key: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/HostResolution' } }
        '304': { description: Sin cambios respecto al ETag enviado. }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /platform/v1/organizations/{organization_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Eventos de identidad y autorización
      description: Adición al catálogo (PF-012). Append-only, sin claims sensibles. Exige `organizations:admin`; la exportación sensible exige además MFA reciente.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - {
            name: from,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Timestamp' },
          }
        - {
            name: to,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Timestamp' },
          }
      responses:
        '200':
          description: Página de auditoría.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie: { $ref: './common.v1.yaml#/components/securitySchemes/sessionCookie' }
    bearerAuth: { $ref: './common.v1.yaml#/components/securitySchemes/bearerAuth' }
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
    InvitationToken:
      name: token
      in: path
      required: true
      description: Token de un solo uso entregado por correo.
      schema: { type: string, minLength: 32, maxLength: 256 }

  schemas:
    OrganizationState:
      type: string
      enum: [provisioning, active, suspended, archived]
    MembershipState:
      type: string
      enum: [invited, active, suspended, revoked, expired]
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    OwnerIdentity:
      type: object
      description: Identidad federada del primer owner, tal como la emite el proveedor OIDC.
      required: [issuer, subject]
      additionalProperties: false
      properties:
        issuer: { type: string, format: uri }
        subject: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 320 }
        display_name: { type: string, maxLength: 200 }
    OrganizationCreate:
      type: object
      required: [slug, display_name, timezone, locale, owner_identity]
      additionalProperties: false
      properties:
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        legal_name: { type: string, maxLength: 200 }
        display_name: { type: string, minLength: 2, maxLength: 200 }
        timezone: { $ref: './common.v1.yaml#/components/schemas/Timezone' }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        owner_identity: { $ref: '#/components/schemas/OwnerIdentity' }
    OrganizationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        legal_name: { type: [string, 'null'], maxLength: 200 }
        display_name: { type: string, minLength: 2, maxLength: 200 }
        timezone: { $ref: './common.v1.yaml#/components/schemas/Timezone' }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
    Organization:
      type: object
      required:
        [
          id,
          organization_id,
          slug,
          display_name,
          timezone,
          locale,
          state,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        legal_name: { type: [string, 'null'] }
        display_name: { type: string }
        timezone: { $ref: './common.v1.yaml#/components/schemas/Timezone' }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        state: { $ref: '#/components/schemas/OrganizationState' }
        revision: { $ref: './common.v1.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Restriction:
      type: object
      description: Limita los permisos del miembro a un evento o sede concretos.
      required: [resource_type, resource_id]
      additionalProperties: false
      properties:
        resource_type: { type: string, enum: [site, event, venue] }
        resource_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        valid_until: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Membership:
      type: object
      required: [id, organization_id, user_id, state, roles, revision, created_at, updated_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        user_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        email: { type: [string, 'null'], description: Visible solo con `organizations:admin`. }
        display_name: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/MembershipState' }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/Restriction' }
        revision: { $ref: './common.v1.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    MembershipPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        state: { type: string, enum: [active, suspended, revoked] }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/Restriction' }
    InvitationCreate:
      type: object
      required: [email, roles, expires_at]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Invitation:
      type: object
      required: [id, organization_id, roles, state, expires_at, created_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        email_masked: { type: string, examples: ['a***@example.org'] }
        roles:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        state: { type: string, enum: [pending, accepted, declined, expired, revoked] }
        expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Me:
      type: object
      required: [user_id, roles, scopes, amr, auth_time]
      properties:
        user_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        active_organization_id:
          { oneOf: [{ $ref: './common.v1.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        roles:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        scopes:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Scope' }
        amr: { type: array, items: { type: string } }
        auth_time: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Capabilities:
      type: object
      required: [organization_id, roles, scopes, restrictions, recent_authentication]
      properties:
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        roles:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        scopes:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Scope' }
        restrictions:
          type: array
          items: { $ref: '#/components/schemas/Restriction' }
        recent_authentication:
          {
            type: boolean,
            description: Verdadero si la autenticación reciente (MFA) sigue vigente.,
          }
    OrganizationMembershipSummary:
      type: object
      required: [organization_id, slug, display_name, roles, active]
      properties:
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        display_name: { type: string }
        roles:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Role' }
        active: { type: boolean, description: Verdadero si es la organización del contexto actual. }
    SessionInfo:
      type: object
      required: [id, current, created_at, last_used_at, expires_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        current: { type: boolean }
        device_label: { type: [string, 'null'] }
        ip_pseudonym:
          { type: [string, 'null'], description: HMAC truncado de la IP; no reversible. }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        last_used_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    ServiceAccountCreate:
      type: object
      required: [name, auth_method, scopes, audiences, expires_at]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        auth_method: { type: string, enum: [client_secret, private_key_jwt] }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: './common.v1.yaml#/components/schemas/Scope' }
        audiences:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, maxLength: 100 }
        expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        public_jwk:
          { type: object, description: Obligatorio cuando el método es `private_key_jwt`. }
    ServiceAccount:
      type: object
      required:
        [id, organization_id, name, auth_method, scopes, audiences, state, expires_at, created_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        name: { type: string }
        auth_method: { type: string, enum: [client_secret, private_key_jwt] }
        scopes:
          type: array
          items: { $ref: './common.v1.yaml#/components/schemas/Scope' }
        audiences: { type: array, items: { type: string } }
        state: { type: string, enum: [active, revoked] }
        expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    ServiceAccountWithSecret:
      allOf:
        - $ref: '#/components/schemas/ServiceAccount'
        - type: object
          properties:
            client_secret:
              type: [string, 'null']
              description: Se muestra una sola vez. Es nulo con `private_key_jwt`.
    DomainCreate:
      type: object
      required: [hostname, verification_method]
      additionalProperties: false
      properties:
        hostname: { type: string, format: hostname, maxLength: 253 }
        verification_method: { type: string, enum: [dns_txt, http_file] }
        primary: { type: boolean, default: false }
    Domain:
      type: object
      required: [id, organization_id, site_id, hostname, state, primary, challenge, created_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        hostname: { type: string }
        state: { type: string, enum: [pending, verifying, active, failed, suspended, released] }
        primary: { type: boolean }
        challenge:
          type: object
          required: [method, name, value]
          properties:
            method: { type: string, enum: [dns_txt, http_file] }
            name: { type: string }
            value: { type: string }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        activated_at:
          { oneOf: [{ $ref: './common.v1.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    HostResolution:
      type: object
      required: [hostname, site_id, organization_id]
      properties:
        hostname: { type: string }
        site_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
    AuditEvent:
      type: object
      required: [id, occurred_at, actor, action, target, outcome, request_id]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        occurred_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, service, system] }
            id: { type: string }
        action: { type: string }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        request_id: { type: string }
