openapi: 3.1.0
info:
  title: Public Read API
  version: 1.0.0
  summary: Proyección pública, inmutable y cacheable de sitios, páginas y eventos publicados.
  description: >-
    Dueño: Equipo 1. Una visita normal nunca llega a Event Configuration ni a Participation: esta API lee
    únicamente la proyección local que Content materializa a partir de eventos. La clave de caché es
    `host/site/locale/slug/publication_id`; no hay cookies privadas ni vistas previas en estas respuestas.
  contact: { name: Equipo 1 — Content & Platform Foundation }
  license: { name: UNLICENSED, identifier: UNLICENSED }
servers:
  - url: http://localhost:4001
    description: Desarrollo local
tags:
  - name: public-sites
  - name: public-events

paths:
  /public/v1/sites/{site_slug}:
    parameters:
      - $ref: '#/components/parameters/SiteSlug'
    get:
      operationId: getPublicSite
      tags: [public-sites]
      summary: Snapshot publicado del sitio
      security: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Sitio con tema, navegación y páginas publicadas.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
            Surrogate-Key: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicSite' } }
        '304': { description: Sin cambios respecto al ETag enviado. }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /public/v1/sites/{site_slug}/pages/{page_path}:
    parameters:
      - $ref: '#/components/parameters/SiteSlug'
      - name: page_path
        in: path
        required: true
        description: Ruta de la página con las barras codificadas (`%2F`); la raíz es `%2F`.
        schema: { type: string, maxLength: 200 }
    get:
      operationId: getPublicPage
      tags: [public-sites]
      summary: Página publicada
      security: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Última publicación de la página.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
            Surrogate-Key: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicPage' } }
        '304': { description: Sin cambios respecto al ETag enviado. }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /public/v1/sites/{site_slug}/events:
    parameters:
      - $ref: '#/components/parameters/SiteSlug'
    get:
      operationId: listPublicEvents
      tags: [public-events]
      summary: Catálogo de eventos publicados
      security: []
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - { name: kind, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - {
            name: from,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Timestamp' },
          }
        - {
            name: to,
            in: query,
            required: false,
            schema: { $ref: './common.v1.yaml#/components/schemas/Timestamp' },
          }
      responses:
        '200':
          description: Página del catálogo proyectado.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
            Surrogate-Key: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicEventSummary' } }
                  next_cursor: { type: [string, 'null'] }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /public/v1/sites/{site_slug}/events/{event_slug}:
    parameters:
      - $ref: '#/components/parameters/SiteSlug'
      - {
          name: event_slug,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Slug' },
        }
    get:
      operationId: getPublicEvent
      tags: [public-events]
      summary: Release público coherente del evento
      description: Agenda, programas y estado de inscripción de una misma `publication_id`; nunca mezcla versiones.
      security: []
      responses:
        '200':
          description: Evento con su release activo.
          headers:
            ETag: { $ref: './common.v1.yaml#/components/headers/ETag' }
            Cache-Control: { schema: { type: string } }
            Surrogate-Key: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicEvent' } }
        '304': { description: Sin cambios respecto al ETag enviado. }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

  /public/v1/previews/{token}:
    get:
      operationId: getPreview
      tags: [public-sites]
      summary: Borrador de una página mediante un enlace de vista previa
      description: >-
        Adición al catálogo (PF-033). El token es de un solo uso y vence en minutos; la respuesta es
        no-store y el borrador no es indexable ni cacheable. Los logs deben redactar el token de la ruta.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '200':
          description: Borrador de la página.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Robots-Tag: { schema: { type: string, const: noindex } }
          content:
            application/json: { schema: { $ref: './cms.v1.yaml#/components/schemas/Page' } }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.v1.yaml#/components/responses/TooManyRequests' }

components:
  parameters:
    SiteSlug:
      name: site_slug
      in: path
      required: true
      schema: { $ref: './common.v1.yaml#/components/schemas/Slug' }
    Locale:
      name: locale
      in: query
      required: false
      schema: { $ref: './common.v1.yaml#/components/schemas/Locale' }

  schemas:
    PublicSite:
      type: object
      required: [slug, name, locale, theme, navigation, pages]
      properties:
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        name: { type: string }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        theme: { $ref: './cms.v1.yaml#/components/schemas/ThemeTokens' }
        navigation:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label: { type: string }
              href: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [path, title]
            properties:
              path: { type: string }
              title: { type: string }
    PublicPage:
      type: object
      required:
        [
          site_slug,
          path,
          title,
          locale,
          blocks,
          seo,
          publication_id,
          version,
          content_hash,
          published_at,
        ]
      properties:
        site_slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        path: { type: string }
        title: { type: string }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        blocks:
          type: array
          items:
            type: object
            required: [type, props]
            properties:
              type: { type: string }
              props: { type: object }
        seo: { type: object }
        publication_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        content_hash: { type: string }
        published_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    RegistrationState:
      type: object
      description: Disponibilidad informativa; Participation toma la decisión final al registrar.
      required: [state, as_of]
      properties:
        state: { type: string, enum: [not_open, open, waitlist_only, closed] }
        remaining_band: { type: [string, 'null'], enum: [plenty, few, none, null] }
        as_of: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    PublicEventSummary:
      type: object
      required: [slug, title, kind, starts_at, ends_at, timezone, status]
      properties:
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        title: { type: string }
        kind: { type: string }
        starts_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        ends_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        timezone: { $ref: './common.v1.yaml#/components/schemas/Timezone' }
        status: { type: string, enum: [published, closed, cancelled] }
        registration: { $ref: '#/components/schemas/RegistrationState' }
    PublicEvent:
      type: object
      required:
        [
          slug,
          title,
          kind,
          starts_at,
          ends_at,
          timezone,
          status,
          publication_id,
          release_version,
          programs,
          sessions,
        ]
      properties:
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        title: { type: string }
        kind: { type: string }
        description: { type: [string, 'null'] }
        starts_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        ends_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        timezone: { $ref: './common.v1.yaml#/components/schemas/Timezone' }
        status: { type: string, enum: [published, closed, cancelled] }
        publication_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        release_version: { type: integer, minimum: 1 }
        programs:
          type: array
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string }
              color: { type: [string, 'null'] }
        sessions:
          type: array
          items:
            type: object
            required: [id, title, starts_at, ends_at]
            properties:
              id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
              program_slug: { type: [string, 'null'] }
              title: { type: string }
              starts_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
              ends_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
              venue_name: { type: [string, 'null'] }
              speakers:
                type: array
                items: { type: string }
        registration: { $ref: '#/components/schemas/RegistrationState' }
