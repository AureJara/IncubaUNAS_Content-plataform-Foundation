openapi: 3.1.0
info:
  title: Auth BFF y emisor de tokens (Equipo 1)
  version: 1.0.0
  description: >-
    Login OIDC con PKCE, sesión por cookie, refresh y logout del gateway (spec 9.2), más las claves públicas de los
    tokens internos y la emisión de tokens de service accounts (spec 9.6). La API la sirve `gateway`.
  license:
    name: Propietario (IncubaUNAS)
    identifier: LicenseRef-IncubaUNAS
servers:
  - url: http://localhost:8080
    description: Gateway local
tags:
  - name: session
    description: Login OIDC, refresh y logout del BFF.
  - name: tokens
    description: Claves públicas y tokens de service accounts.
  - name: health
    description: Vida y disponibilidad del servicio.
security: []
paths:
  /health/live:
    $ref: './common.yaml#/components/pathItems/HealthLive'
  /health/ready:
    $ref: './common.yaml#/components/pathItems/HealthReady'

  /auth/login:
    get:
      operationId: startLogin
      summary: Iniciar el login OIDC
      description: >-
        Crea `state`, `nonce` y el verificador PKCE del lado del servidor y redirige al IdP. Un `return_to` fuera de la
        allowlist exacta lleva al inicio (RN-12).
      tags: [session]
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '302':
          description: Redirección al IdP.
          headers:
            Location:
              description: URL de autorización del IdP.
              schema: { type: string, format: uri }
              example: http://localhost:8180/realms/incubaunas/protocol/openid-connect/auth?client_id=gateway&response_type=code&state=example-state
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }

  /auth/callback:
    get:
      operationId: completeLogin
      summary: Volver del IdP y crear la sesión
      description: Valida `state`, `nonce`, PKCE, issuer y audience (PF-004).
      tags: [session]
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '302':
          description: Sesión creada; redirige al destino validado.
          headers:
            Location:
              description: Destino de la allowlist.
              schema: { type: string, format: uri-reference }
              example: /admin/
            Set-Cookie:
              description: Cookie de sesión `__Host-sid` (HttpOnly; Secure; SameSite=Lax).
              schema: { type: string }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotar la sesión
      description: Cada refresh rota el ID; reutilizar uno rotado revoca la familia (RN-09).
      tags: [session]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '204':
          description: Cookie nueva.
          headers:
            Set-Cookie:
              description: Cookie de sesión rotada.
              schema: { type: string }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar la sesión
      description: Revoca la sesión y limpia la cookie aunque falle el logout federado. Idempotente.
      tags: [session]
      security:
        - csrfToken: []
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              description: Cookie vencida.
              schema: { type: string }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Cerrar todas las sesiones del usuario
      tags: [session]
      x-recent-mfa: true
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '204':
          description: Todas las familias revocadas.
          headers:
            Set-Cookie:
              description: Cookie vencida.
              schema: { type: string }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Claves públicas de los tokens internos
      tags: [tokens]
      responses:
        '200':
          description: JWKS con la clave vigente y la anterior durante la rotación.
          headers:
            Cache-Control:
              description: Las claves se cachean poco tiempo.
              schema: { type: string }
              example: public, max-age=300
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
              examples:
                jwks: { $ref: '../examples/auth.yaml#/jwks' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }

  /oauth/token:
    post:
      operationId: issueServiceToken
      summary: Token de una service account
      description: >-
        `client_credentials` con secreto o con `private_key_jwt` (PF-011). La audience es exacta. Los errores siguen RFC
        6749, no Problem Details.
      tags: [tokens]
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              client_secret: { $ref: '../examples/auth.yaml#/token_request' }
      responses:
        '200':
          description: Token interno con TTL corto.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              examples:
                token: { $ref: '../examples/auth.yaml#/token_response' }
        '400':
          description: Solicitud inválida.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                invalid_scope: { $ref: '../examples/auth.yaml#/oauth_invalid_scope' }
        '401':
          description: Cliente inválido, vencido o revocado.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                invalid_client: { $ref: '../examples/auth.yaml#/oauth_invalid_client' }

components:
  securitySchemes:
    sessionCookie: { $ref: './common.yaml#/components/securitySchemes/sessionCookie' }
    csrfToken: { $ref: './common.yaml#/components/securitySchemes/csrfToken' }
  schemas:
    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, kid, use, alg, x, y]
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        kid: { type: string }
        use: { type: string, const: sig }
        alg: { type: string, const: ES256 }
        x: { type: string }
        y: { type: string }
    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Jwk' }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, audience]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id: { type: string, maxLength: 128 }
        client_secret: { type: string, maxLength: 256 }
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion: { type: string, maxLength: 4096 }
        scope: { type: string, maxLength: 1024 }
        audience: { type: string, pattern: '^[a-z0-9-]{2,63}$' }
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1, maximum: 900 }
        scope: { type: string }
    OAuthError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description: { type: string }
