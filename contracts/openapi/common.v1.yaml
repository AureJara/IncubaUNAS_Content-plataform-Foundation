openapi: 3.1.0
info:
  title: Componentes comunes de las APIs del Equipo 1
  version: 1.0.0
  description: >-
    Convenciones transversales del catálogo (API-CONTRACTS.md): JSON snake_case, UUIDv7, cursor opaco,
    Problem Details, Idempotency-Key en comandos, If-Match/ETag en ediciones. Este documento solo se
    referencia con `$ref`; no define rutas.
paths: {}
components:
  headers:
    RequestId:
      description: Identificador de la petición; se acepta solo si tiene formato válido, si no se regenera.
      schema: { type: string, maxLength: 64 }
    ETag:
      description: Revisión del recurso, usar en `If-Match` para editar.
      schema: { type: string }
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar.
      schema: { type: integer, minimum: 0 }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Clave de 16 a 128 caracteres. La misma clave con el mismo cuerpo reproduce la respuesta;
        con otro cuerpo devuelve `409 idempotency_key_reused`. Retención mínima 24 h.
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la revisión que se quiere modificar. Una revisión obsoleta devuelve `412 stale_revision`.
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token CSRF emparejado con la cookie de sesión.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `next_cursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    BadRequest:
      description: La petición no es válida.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Unauthorized:
      description: Token o sesión ausente, vencida o inválida.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Forbidden:
      description: Identidad válida sin permiso para la acción. No revela datos personales.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    NotFound:
      description: El recurso no existe o pertenece a otra organización (no se distingue, para evitar enumeración).
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Conflict:
      description: Estado o clave de idempotencia en conflicto.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    PreconditionFailed:
      description: La revisión enviada en `If-Match` ya no es la vigente.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    UnprocessableEntity:
      description: La petición está bien formada pero viola una regla de validación.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    TooManyRequests:
      description: Se superó la cuota.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generado por la aplicación.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 en UTC.
    Slug:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
      description: Seguro para DNS y URLs.
    Locale:
      type: string
      pattern: '^[a-z]{2}(-[A-Z]{2})?$'
      examples: [es-PE]
    Timezone:
      type: string
      description: Zona horaria IANA.
      examples: [America/Lima]
    Revision:
      type: integer
      minimum: 1
    ErrorCode:
      type: string
      enum:
        - invalid_state_transition
        - stale_revision
        - tenant_forbidden
        - validation_failed
        - idempotency_key_reused
        - idempotency_key_required
        - already_exists
        - last_owner_required
        - invitation_expired
        - invitation_not_pending
        - mfa_required
        - recent_authentication_required
        - csrf_invalid
        - return_to_not_allowed
        - session_revoked
        - publication_incomplete
        - release_gap
        - resource_in_use
        - media_not_ready
        - media_quarantined
        - domain_verification_failed
        - rate_limited
        - unauthenticated
        - forbidden
        - not_found
    ProblemError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: JSON Pointer al campo en falta o inválido. }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      description: Problem Details (RFC 9457) con `code` estable y `request_id`.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ProblemError' }
    Operation:
      type: object
      description: Recurso consultable que acompaña a toda respuesta `202`.
      required: [id, state, progress]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result_ref: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    Role:
      type: string
      enum:
        - org_owner
        - security_admin
        - site_editor
        - event_manager
        - application_reviewer
        - checkin_staff
        - checkin_supervisor
        - report_viewer
    Scope:
      type: string
      enum:
        - organizations:admin
        - sites:write
        - sites:publish
        - events:write
        - events:publish
        - events:read
        - participation:read
        - participation:manage
        - registration:self
        - onsite:checkin
        - onsite:void
        - communications:send
        - reports:read
        - reports:export_sensitive
        - certificates:issue
        - certificates:revoke
        - platform:admin
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Cookie HttpOnly, Secure, SameSite=Lax con identificador opaco. Las mutaciones exigen además `X-CSRF-Token`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con audience exacta, scopes mínimos y `organization_id` firmado (clientes de servicio).
