openapi: 3.1.0
info:
  title: CMS API (Equipo 1)
  version: 1.0.0
  description: >-
    Sitios, tema, navegación, páginas con bloques tipados, vistas previas, publicaciones y medios (spec 9.4 y 9.6). La
    sirve `content-api` (proceso cms) detrás del gateway, con un token interno de audience `content-api`.


    Extensiones: `x-required-scope` (scope del token).
  license:
    name: Propietario (IncubaUNAS)
    identifier: LicenseRef-IncubaUNAS
servers:
  - url: http://localhost:8080
    description: Gateway local
tags:
  - name: sites
    description: Sitios, tema y navegación.
  - name: pages
    description: Páginas con bloques tipados y vistas previas.
  - name: publications
    description: Versiones inmutables y restauraciones.
  - name: media
    description: Imágenes y documentos con antivirus.
  - name: health
    description: Vida y disponibilidad del servicio.
security:
  - internalToken: []
paths:
  /health/live:
    $ref: './common.yaml#/components/pathItems/HealthLive'
  /health/ready:
    $ref: './common.yaml#/components/pathItems/HealthReady'

  /cms/v1/sites:
    post:
      operationId: createSite
      summary: Crear un sitio en borrador
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteCreate' }
            examples:
              create: { $ref: '../examples/cms.yaml#/site_create' }
      responses:
        '201':
          description: Sitio en borrador.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              examples:
                site: { $ref: '../examples/cms.yaml#/site_draft' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409':
          description: El slug ya existe en la organización.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
              examples:
                slug_taken: { $ref: '../examples/cms.yaml#/slug_taken' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
    get:
      operationId: listSites
      summary: Sitios de la organización
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Sitios.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteCollection' }
              examples:
                sites: { $ref: '../examples/cms.yaml#/sites' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /cms/v1/sites/{id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/IdPath'
    get:
      operationId: getSite
      summary: Configuración del sitio
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: Sitio con su tema y navegación vigentes.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              examples:
                site: { $ref: '../examples/cms.yaml#/site' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateSite
      summary: Configurar el sitio
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SitePatch' }
            examples:
              patch: { $ref: '../examples/cms.yaml#/site_patch' }
      responses:
        '200':
          description: Sitio actualizado.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              examples:
                site: { $ref: '../examples/cms.yaml#/site' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }

  /cms/v1/sites/{id}/theme:
    put:
      operationId: putSiteTheme
      summary: Guardar una versión nueva del tema
      description: Tokens de una allowlist con contraste AA validado (PF-038, RN-18).
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdPath'
        - $ref: './common.yaml#/components/parameters/IfMatch'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThemeInput' }
            examples:
              theme: { $ref: '../examples/cms.yaml#/theme_input' }
      responses:
        '200':
          description: Tema nuevo.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Theme' }
              examples:
                theme: { $ref: '../examples/cms.yaml#/theme' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }

  /cms/v1/sites/{id}/navigation:
    put:
      operationId: putSiteNavigation
      summary: Guardar una versión nueva de la navegación
      description: Enlaces solo relativos o `https:` (RN-18).
      tags: [sites]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdPath'
        - $ref: './common.yaml#/components/parameters/IfMatch'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NavigationInput' }
            examples:
              navigation: { $ref: '../examples/cms.yaml#/navigation_input' }
      responses:
        '200':
          description: Navegación nueva.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Navigation' }
              examples:
                navigation: { $ref: '../examples/cms.yaml#/navigation' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }

  /cms/v1/sites/{id}/pages:
    parameters:
      - $ref: './common.yaml#/components/parameters/IdPath'
    post:
      operationId: createPage
      summary: Crear una página en borrador
      tags: [pages]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageCreate' }
            examples:
              create: { $ref: '../examples/cms.yaml#/page_create' }
      responses:
        '201':
          description: Página en borrador.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
              examples:
                page: { $ref: '../examples/cms.yaml#/page_draft' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
    get:
      operationId: listPages
      summary: Páginas del sitio
      tags: [pages]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Páginas, sin sus bloques.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageSummaryCollection' }
              examples:
                pages: { $ref: '../examples/cms.yaml#/pages' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }

  /cms/v1/pages/{id}:
    parameters:
      - $ref: './common.yaml#/components/parameters/IdPath'
    get:
      operationId: getPage
      summary: Borrador de la página y su revisión
      tags: [pages]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: Página con su borrador.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
              examples:
                page: { $ref: '../examples/cms.yaml#/page' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePage
      summary: Guardar el borrador (revisión nueva)
      description: Autosave con control de conflicto; el 412 se muestra en la UI (PF-031).
      tags: [pages]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/PagePatch' }
            examples:
              patch: { $ref: '../examples/cms.yaml#/page_patch' }
      responses:
        '200':
          description: Revisión nueva del borrador.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
              examples:
                page: { $ref: '../examples/cms.yaml#/page' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }

  /cms/v1/pages/{id}/preview-tokens:
    post:
      operationId: createPreviewToken
      summary: Crear una vista previa corta y de un uso
      tags: [pages]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdPath'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewTokenCreate' }
            examples:
              create: { $ref: '../examples/cms.yaml#/preview_token_create' }
      responses:
        '201':
          description: URL de vista previa ligada al usuario.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewToken' }
              examples:
                preview: { $ref: '../examples/cms.yaml#/preview_token' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }

  /cms/v1/pages/{id}/publications:
    parameters:
      - $ref: './common.yaml#/components/parameters/IdPath'
    post:
      operationId: publishPage
      summary: Publicar una versión inmutable
      description: >-
        Crea el snapshot con su hash, pasa la publicación anterior a `superseded` y escribe
        `content.page.published.v1` en el outbox (spec 3.6 flujo C).
      tags: [publications]
      x-required-scope: sites:publish
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationCreate' }
            examples:
              publish: { $ref: '../examples/cms.yaml#/publication_create' }
      responses:
        '201':
          description: Publicación vigente.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
              examples:
                publication: { $ref: '../examples/cms.yaml#/publication' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }
    get:
      operationId: listPublications
      summary: Historial de publicaciones
      tags: [publications]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Publicaciones, de la más reciente a la más antigua.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationCollection' }
              examples:
                publications: { $ref: '../examples/cms.yaml#/publications' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }

  /cms/v1/pages/{id}/restorations:
    post:
      operationId: restorePublication
      summary: Restaurar una versión previa como publicación nueva
      description: El snapshot viejo nunca cambia (RN-13).
      tags: [publications]
      x-required-scope: sites:publish
      parameters:
        - $ref: './common.yaml#/components/parameters/IdPath'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestorationCreate' }
            examples:
              restore: { $ref: '../examples/cms.yaml#/restoration_create' }
      responses:
        '201':
          description: Publicación nueva basada en la elegida.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
              examples:
                publication: { $ref: '../examples/cms.yaml#/publication_restored' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }

  /cms/v1/media-uploads:
    post:
      operationId: createMediaUpload
      summary: Pedir una URL de subida firmada
      description: MIME de una allowlist (sin SVG), tamaño máximo y hash (PF-032).
      tags: [media]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadCreate' }
            examples:
              upload: { $ref: '../examples/cms.yaml#/media_upload_create' }
      responses:
        '201':
          description: Medio `pending` y URL de subida corta.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
              examples:
                upload: { $ref: '../examples/cms.yaml#/media_upload' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }

  /cms/v1/media/{id}/completion:
    post:
      operationId: completeMediaUpload
      summary: Confirmar la subida y lanzar el antivirus
      tags: [media]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/IdPath'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaCompletion' }
            examples:
              completion: { $ref: '../examples/cms.yaml#/media_completion' }
      responses:
        '200':
          description: Medio en `scanning`; luego pasa a `ready` o `quarantined`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
              examples:
                scanning: { $ref: '../examples/cms.yaml#/media_scanning' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/ValidationFailed' }

  /cms/v1/media:
    get:
      operationId: listMedia
      summary: Biblioteca de medios
      tags: [media]
      x-required-scope: sites:write
      parameters:
        - $ref: './common.yaml#/components/parameters/RequestId'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MediaState' }
      responses:
        '200':
          description: Medios.
          headers:
            Cache-Control: { $ref: './common.yaml#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaCollection' }
              examples:
                media: { $ref: '../examples/cms.yaml#/media_list' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

components:
  securitySchemes:
    internalToken: { $ref: './common.yaml#/components/securitySchemes/internalToken' }
  schemas:
    SiteKind:
      type: string
      enum: [product, demo, client]
    SiteState:
      type: string
      description: Estados del sitio **(propuesta)**.
      enum: [draft, live, archived]
    PagePath:
      type: string
      description: Ruta de la página, en minúsculas; `/` es la portada.
      pattern: '^/([a-z0-9-]+(/[a-z0-9-]+)*)?$'
      maxLength: 255
    Link:
      type: string
      description: Solo relativo o `https:` (RN-18).
      maxLength: 2048
      pattern: '^(/[^\s]*|https://[^\s]+)$'
    HexColor:
      type: string
      pattern: '^#[0-9a-f]{6}$'
    ThemeTokens:
      type: object
      additionalProperties: false
      required: [color_primary, color_on_primary, color_background, color_text, font_family, radius]
      properties:
        color_primary: { $ref: '#/components/schemas/HexColor' }
        color_on_primary: { $ref: '#/components/schemas/HexColor' }
        color_background: { $ref: '#/components/schemas/HexColor' }
        color_text: { $ref: '#/components/schemas/HexColor' }
        font_family: { type: string, enum: [system, serif, humanist] }
        radius: { type: string, enum: [none, small, medium] }
    ThemeInput:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
    Theme:
      type: object
      additionalProperties: false
      required: [revision, tokens, updated_at]
      properties:
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    NavigationItem:
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        href: { $ref: '#/components/schemas/Link' }
    NavigationInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/NavigationItem' }
    Navigation:
      type: object
      additionalProperties: false
      required: [revision, items, updated_at]
      properties:
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        items:
          type: array
          items: { $ref: '#/components/schemas/NavigationItem' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    Site:
      type: object
      additionalProperties: false
      required:
        [id, organization_id, slug, name, kind, locale, state, theme, navigation, revision, created_at, updated_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        slug: { $ref: './common.yaml#/components/schemas/Slug' }
        name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/SiteKind' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        state: { $ref: '#/components/schemas/SiteState' }
        theme: { $ref: '#/components/schemas/Theme' }
        navigation: { $ref: '#/components/schemas/Navigation' }
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    SiteCreate:
      type: object
      additionalProperties: false
      required: [slug, name, kind, locale]
      properties:
        slug: { $ref: './common.yaml#/components/schemas/Slug' }
        name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/SiteKind' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
    SitePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        state: { $ref: '#/components/schemas/SiteState' }
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, kind, locale, state, updated_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        slug: { $ref: './common.yaml#/components/schemas/Slug' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SiteKind' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        state: { $ref: '#/components/schemas/SiteState' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    SiteCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SiteSummary' }
        next_cursor: { $ref: './common.yaml#/components/schemas/NextCursor' }
    Block:
      description: Bloque tipado; cada tipo valida contra su JSON Schema versionado (PF-031).
      oneOf:
        - $ref: '../schemas/blocks/hero.v1.json'
        - $ref: '../schemas/blocks/rich_text.v1.json'
        - $ref: '../schemas/blocks/image.v1.json'
        - $ref: '../schemas/blocks/event_catalog.v1.json'
        - $ref: '../schemas/blocks/featured_event.v1.json'
        - $ref: '../schemas/blocks/agenda.v1.json'
      discriminator:
        propertyName: type
    Blocks:
      type: array
      maxItems: 50
      items: { $ref: '#/components/schemas/Block' }
    Seo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 160 }
        canonical: { type: string, format: uri, pattern: '^https://' }
    PageState:
      type: string
      description: '`published` si tiene una publicación vigente; el borrador puede ser más nuevo.'
      enum: [draft, published]
    Page:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organization_id,
          site_id,
          path,
          locale,
          title,
          seo,
          blocks,
          state,
          current_publication_id,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        path: { $ref: '#/components/schemas/PagePath' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        title: { type: string, minLength: 1, maxLength: 120 }
        seo: { $ref: '#/components/schemas/Seo' }
        blocks: { $ref: '#/components/schemas/Blocks' }
        state: { $ref: '#/components/schemas/PageState' }
        current_publication_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    PageCreate:
      type: object
      additionalProperties: false
      required: [path, title, blocks]
      properties:
        path: { $ref: '#/components/schemas/PagePath' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        title: { type: string, minLength: 1, maxLength: 120 }
        seo: { $ref: '#/components/schemas/Seo' }
        blocks: { $ref: '#/components/schemas/Blocks' }
    PagePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        path: { $ref: '#/components/schemas/PagePath' }
        title: { type: string, minLength: 1, maxLength: 120 }
        seo: { $ref: '#/components/schemas/Seo' }
        blocks: { $ref: '#/components/schemas/Blocks' }
    PageSummary:
      type: object
      additionalProperties: false
      required: [id, path, locale, title, state, current_publication_id, revision, updated_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        path: { $ref: '#/components/schemas/PagePath' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        title: { type: string }
        state: { $ref: '#/components/schemas/PageState' }
        current_publication_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    PageSummaryCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PageSummary' }
        next_cursor: { $ref: './common.yaml#/components/schemas/NextCursor' }
    PreviewTokenCreate:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 900
          description: 15 minutos como máximo (PF-033).
    PreviewToken:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    PublicationState:
      type: string
      enum: [published, superseded]
    Publication:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organization_id,
          site_id,
          page_id,
          version,
          source_revision,
          path,
          locale,
          content_hash,
          state,
          restored_from,
          published_at,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        page_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        source_revision: { $ref: './common.yaml#/components/schemas/Revision' }
        path: { $ref: '#/components/schemas/PagePath' }
        locale: { $ref: './common.yaml#/components/schemas/Locale' }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        state: { $ref: '#/components/schemas/PublicationState' }
        restored_from:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        published_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    PublicationCreate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { $ref: './common.yaml#/components/schemas/Revision' }
    RestorationCreate:
      type: object
      additionalProperties: false
      required: [source_publication_id]
      properties:
        source_publication_id: { $ref: './common.yaml#/components/schemas/Uuid' }
    PublicationCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Publication' }
        next_cursor: { $ref: './common.yaml#/components/schemas/NextCursor' }
    MediaState:
      type: string
      enum: [pending, scanning, ready, quarantined, retired]
    MediaMime:
      type: string
      description: Allowlist; SVG no se acepta (PF-032).
      enum: [image/jpeg, image/png, image/webp, image/avif, application/pdf]
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Media:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, mime, size, sha256, alt, state, url, revision, created_at, updated_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 200 }
        mime: { $ref: '#/components/schemas/MediaMime' }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        alt: { type: [string, 'null'], maxLength: 250 }
        state: { $ref: '#/components/schemas/MediaState' }
        url:
          type: [string, 'null']
          format: uri
          description: Solo cuando el medio está `ready` (RN-17).
        revision: { $ref: './common.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    MediaUploadCreate:
      type: object
      additionalProperties: false
      required: [name, mime, size, sha256]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mime: { $ref: '#/components/schemas/MediaMime' }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        alt: { type: string, minLength: 1, maxLength: 250 }
    MediaUpload:
      type: object
      additionalProperties: false
      required: [media, upload]
      properties:
        media: { $ref: '#/components/schemas/Media' }
        upload:
          type: object
          additionalProperties: false
          required: [method, url, expires_at]
          properties:
            method: { type: string, const: PUT }
            url: { type: string, format: uri }
            expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    MediaCompletion:
      type: object
      additionalProperties: false
      required: [size, sha256]
      properties:
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
    MediaCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Media' }
        next_cursor: { $ref: './common.yaml#/components/schemas/NextCursor' }
