openapi: 3.1.0
info:
  title: CMS API
  version: 1.0.0
  summary: Sitios, páginas con bloques tipados, medios y publicaciones inmutables.
  description: >-
    Dueño: Equipo 1. Las publicaciones son snapshots inmutables con hash; restaurar una versión crea una
    publicación nueva y nunca modifica la anterior. El tenant sale de la sesión o del token firmado.
  contact: { name: Equipo 1 — Content & Platform Foundation }
  license: { name: UNLICENSED, identifier: UNLICENSED }
servers:
  - url: http://localhost:4001
    description: Desarrollo local
tags:
  - name: sites
  - name: pages
  - name: publications
  - name: media

paths:
  /cms/v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: Sitios de la organización
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de sitios.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Site' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
    post:
      operationId: createSite
      tags: [sites]
      summary: Crea un sitio en borrador
      description: Exige `sites:write`. Tipo `product`, `demo` o `client`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SiteCreate' } }
      responses:
        '201':
          description: Sitio creado.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Site' } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      tags: [sites]
      summary: Configuración del sitio
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Sitio con su ETag.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Site' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Edita tema, navegación y datos del sitio
      description: Los tokens de tema son una lista permitida con contraste validado; la navegación no admite enlaces inseguros.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IfMatch'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/SitePatch' } }
      responses:
        '200':
          description: Sitio actualizado.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Site' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.v1.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/sites/{site_id}/pages:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listPages
      tags: [pages]
      summary: Páginas del sitio
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Page' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
    post:
      operationId: createPage
      tags: [pages]
      summary: Crea una página en borrador
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PageCreate' } }
      responses:
        '201':
          description: Borrador creado.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Page' } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/pages/{page_id}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: getPage
      tags: [pages]
      summary: Borrador vigente de la página
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Página con su ETag.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Page' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePage
      tags: [pages]
      summary: Edita el borrador
      description: Cada bloque se valida contra su JSON Schema y se sanitiza. Los errores se devuelven por `pointer`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IfMatch'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/PagePatch' } }
      responses:
        '200':
          description: Borrador actualizado.
          headers: { ETag: { $ref: './common.v1.yaml#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Page' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.v1.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/pages/{page_id}/preview-tokens:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: createPreviewToken
      tags: [pages]
      summary: Emite un enlace de vista previa
      description: Token corto y de un solo uso. La respuesta del preview es `no-store` y el borrador no es indexable.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              additionalProperties: false
              properties:
                ttl_seconds: { type: integer, minimum: 30, maximum: 900 }
      responses:
        '201':
          description: URL de vista previa.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [preview_url, expires_at]
                properties:
                  preview_url: { type: string, format: uri }
                  expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }

  /cms/v1/pages/{page_id}/publications:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: publishPage
      tags: [publications]
      summary: Publica una versión inmutable
      description: >-
        Congela un snapshot con hash y emite `content.page.published.v1` por outbox. Idempotente; un borrador
        posterior no modifica lo publicado. Exige `sites:publish`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              additionalProperties: false
              properties:
                expected_revision: { $ref: './common.v1.yaml#/components/schemas/Revision' }
      responses:
        '201':
          description: Publicación creada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/PagePublication' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.v1.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/pages/{page_id}/restorations:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: restorePage
      tags: [publications]
      summary: Restaura una versión previa como publicación nueva
      description: Nunca muta el snapshot antiguo; deja registro de auditoría.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_version]
              additionalProperties: false
              properties:
                source_version: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Publicación nueva basada en la versión indicada.
          content:
            application/json: { schema: { $ref: '#/components/schemas/PagePublication' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }

  /cms/v1/media-uploads:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Solicita una subida firmada
      description: >-
        Valida MIME, tamaño y hash. El archivo queda `pending` hasta que el escaneo lo marque `ready` o
        `quarantined`. Las imágenes públicas exigen `alt_text`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MediaUploadCreate' } }
      responses:
        '201':
          description: Activo pendiente y destino de subida.
          content:
            application/json: { schema: { $ref: '#/components/schemas/MediaUploadTicket' } }
        '400': { $ref: './common.v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

  /cms/v1/media/{media_id}/completion:
    parameters:
      - {
          name: media_id,
          in: path,
          required: true,
          schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' },
        }
    post:
      operationId: completeMediaUpload
      tags: [media]
      summary: Confirma que el archivo se subió
      description: Dispara el escaneo. El estado evoluciona `pending → scanning → ready | quarantined`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: './common.v1.yaml#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size_bytes]
              additionalProperties: false
              properties:
                size_bytes: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Activo con su estado actual.
          content:
            application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } }
        '401': { $ref: './common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.v1.yaml#/components/responses/UnprocessableEntity' }

components:
  securitySchemes:
    sessionCookie: { $ref: './common.v1.yaml#/components/securitySchemes/sessionCookie' }
    bearerAuth: { $ref: './common.v1.yaml#/components/securitySchemes/bearerAuth' }
  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
    PageId:
      name: page_id
      in: path
      required: true
      schema: { $ref: './common.v1.yaml#/components/schemas/Uuid' }

  schemas:
    SiteKind:
      type: string
      enum: [product, demo, client]
    ThemeTokens:
      type: object
      description: Lista permitida de tokens; los colores se validan por contraste WCAG AA.
      additionalProperties: false
      properties:
        color_primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_text: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        font_family: { type: string, enum: [system-ui, inter, source-serif] }
        radius: { type: string, enum: [none, sm, md, lg] }
    NavigationItem:
      type: object
      required: [label, href]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        href:
          {
            type: string,
            pattern: '^(/|https://)',
            maxLength: 2048,
            description: Ruta relativa o HTTPS; nunca `javascript:` ni `data:`.,
          }
    SiteCreate:
      type: object
      required: [slug, name, kind, locale]
      additionalProperties: false
      properties:
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        name: { type: string, minLength: 2, maxLength: 120 }
        kind: { $ref: '#/components/schemas/SiteKind' }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
    SitePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        theme: { $ref: '#/components/schemas/ThemeTokens' }
        navigation:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/NavigationItem' }
    Site:
      type: object
      required:
        [
          id,
          organization_id,
          slug,
          name,
          kind,
          locale,
          theme,
          navigation,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        slug: { $ref: './common.v1.yaml#/components/schemas/Slug' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SiteKind' }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        theme: { $ref: '#/components/schemas/ThemeTokens' }
        navigation:
          type: array
          items: { $ref: '#/components/schemas/NavigationItem' }
        revision: { $ref: './common.v1.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    Block:
      type: object
      description: Bloque tipado. `props` se valida contra el JSON Schema registrado para su `type`.
      required: [type, props]
      additionalProperties: false
      properties:
        type:
          {
            type: string,
            enum:
              [hero, rich_text, image, event_catalog, featured_event, agenda, cta, faq, lead_form],
          }
        props: { type: object }
    Seo:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 160 }
        canonical_url: { type: string, format: uri }
        og_image_media_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        robots: { type: string, enum: [index, noindex] }
    PageCreate:
      type: object
      required: [path, title]
      additionalProperties: false
      properties:
        path: { type: string, pattern: '^/([a-z0-9-]+(/[a-z0-9-]+)*)?$', maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 150 }
        blocks:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Block' }
        seo: { $ref: '#/components/schemas/Seo' }
    PagePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        blocks:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Block' }
        seo: { $ref: '#/components/schemas/Seo' }
    Page:
      type: object
      required:
        [
          id,
          organization_id,
          site_id,
          path,
          title,
          locale,
          blocks,
          seo,
          published_version,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        path: { type: string }
        title: { type: string }
        locale: { $ref: './common.v1.yaml#/components/schemas/Locale' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/Block' }
        seo: { $ref: '#/components/schemas/Seo' }
        published_version:
          {
            type: [integer, 'null'],
            description: Última versión publicada; nulo si nunca se publicó.,
          }
        revision: { $ref: './common.v1.yaml#/components/schemas/Revision' }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    PagePublication:
      type: object
      required: [id, page_id, version, content_hash, published_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        page_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        restored_from_version: { type: [integer, 'null'] }
        published_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    MediaUploadCreate:
      type: object
      required: [file_name, mime_type, size_bytes, sha256]
      additionalProperties: false
      properties:
        file_name: { type: string, minLength: 1, maxLength: 200 }
        mime_type:
          {
            type: string,
            enum: [image/png, image/jpeg, image/webp, image/svg+xml, application/pdf],
          }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        alt_text: { type: string, maxLength: 300 }
    MediaAsset:
      type: object
      required: [id, organization_id, file_name, mime_type, size_bytes, state, created_at]
      properties:
        id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        organization_id: { $ref: './common.v1.yaml#/components/schemas/Uuid' }
        file_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        alt_text: { type: [string, 'null'] }
        state: { type: string, enum: [pending, scanning, ready, quarantined] }
        created_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
    MediaUploadTicket:
      type: object
      required: [asset, upload]
      properties:
        asset: { $ref: '#/components/schemas/MediaAsset' }
        upload:
          type: object
          required: [method, url, expires_at]
          properties:
            method: { type: string, const: PUT }
            url: { type: string, format: uri }
            headers: { type: object, additionalProperties: { type: string } }
            expires_at: { $ref: './common.v1.yaml#/components/schemas/Timestamp' }
