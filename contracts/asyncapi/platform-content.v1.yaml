asyncapi: 3.0.0
info:
  title: Eventos de Platform y Content
  version: 1.0.0
  description: >-
    Dueño: Equipo 1. Entrega al menos una vez con outbox transaccional en el productor e inbox idempotente
    en el consumidor; el orden solo se garantiza por `partition_key`. Los eventos del Equipo 2 y 3 que Content
    consume están descritos del lado consumidor y quedan pendientes de confirmar con sus dueños.
  contact:
    name: Equipo 1 — Content & Platform Foundation
  license:
    name: UNLICENSED
  tags:
    - name: platform
    - name: content
defaultContentType: application/json
servers:
  event-bus:
    host: event-bus.internal:5672
    protocol: amqp
    description: Broker por decidir. El contrato de eventos no depende de él (ver ARCHITECTURE-SPINE, sección Deferred).

channels:
  organizationLifecycleChanged:
    address: platform.organization.lifecycle_changed.v1
    messages:
      message:
        name: platform.organization.lifecycle_changed.v1
        payload:
          $ref: '../schemas/events/platform.organization.lifecycle_changed.v1.json'
  membershipChanged:
    address: platform.membership.changed.v1
    messages:
      message:
        name: platform.membership.changed.v1
        payload:
          $ref: '../schemas/events/platform.membership.changed.v1.json'
  domainActivated:
    address: platform.domain.activated.v1
    messages:
      message:
        name: platform.domain.activated.v1
        payload:
          $ref: '../schemas/events/platform.domain.activated.v1.json'
  pagePublished:
    address: content.page.published.v1
    messages:
      message:
        name: content.page.published.v1
        payload:
          $ref: '../schemas/events/content.page.published.v1.json'
  releasePublished:
    address: configuration.event.release_published.v1
    messages:
      message:
        name: configuration.event.release_published.v1
        payload:
          $ref: '../schemas/events/configuration.event.release_published.v1.json'
  eventCancelled:
    address: configuration.event.cancelled.v1
    messages:
      message:
        name: configuration.event.cancelled.v1
        payload:
          $ref: '../schemas/events/configuration.event.cancelled.v1.json'
  scheduleChanged:
    address: configuration.schedule.changed.v1
    messages:
      message:
        name: configuration.schedule.changed.v1
        payload:
          $ref: '../schemas/events/configuration.schedule.changed.v1.json'
  availabilityChanged:
    address: participation.availability.changed.v1
    messages:
      message:
        name: participation.availability.changed.v1
        payload:
          $ref: '../schemas/events/participation.availability.changed.v1.json'

operations:
  publishOrganizationLifecycleChanged:
    action: send
    summary: Una organización cambia de estado.
    channel: { $ref: '#/channels/organizationLifecycleChanged' }
  publishMembershipChanged:
    action: send
    summary: Una membresía cambia de roles o de estado.
    channel: { $ref: '#/channels/membershipChanged' }
  publishDomainActivated:
    action: send
    summary: Un dominio propio pasa a estar activo.
    channel: { $ref: '#/channels/domainActivated' }
  publishPagePublished:
    action: send
    summary: Se publica una versión inmutable de una página.
    channel: { $ref: '#/channels/pagePublished' }
  consumeReleasePublished:
    action: receive
    summary: Content materializa la release pending y la activa solo con el manifiesto completo.
    channel: { $ref: '#/channels/releasePublished' }
  consumeEventCancelled:
    action: receive
    summary: Content marca el evento como cancelado en la proyección pública.
    channel: { $ref: '#/channels/eventCancelled' }
  consumeScheduleChanged:
    action: receive
    summary: Content refresca la agenda proyectada del evento.
    channel: { $ref: '#/channels/scheduleChanged' }
  consumeAvailabilityChanged:
    action: receive
    summary: Content actualiza la disponibilidad informativa del evento.
    channel: { $ref: '#/channels/availabilityChanged' }
