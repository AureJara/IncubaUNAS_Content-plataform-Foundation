# Servicios locales de desarrollo del Equipo 1. Solo se publican en 127.0.0.1.
# Las contraseñas por defecto son valores de desarrollo; en cualquier otro entorno vienen de un secret manager.
name: incubaunas-foundation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev_only_admin_password}
      PLATFORM_DB_MIGRATOR_PASSWORD: ${PLATFORM_DB_MIGRATOR_PASSWORD:-dev_only_platform_migrator}
      PLATFORM_DB_APP_PASSWORD: ${PLATFORM_DB_APP_PASSWORD:-dev_only_platform_app}
      CONTENT_DB_MIGRATOR_PASSWORD: ${CONTENT_DB_MIGRATOR_PASSWORD:-dev_only_content_migrator}
      CONTENT_DB_APP_PASSWORD: ${CONTENT_DB_APP_PASSWORD:-dev_only_content_app}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d platform']
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev_only_keycloak_admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  pgdata:
